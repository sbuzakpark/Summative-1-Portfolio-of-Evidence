<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - My Simple Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Site navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="reviews.html">Reviews</a>
        <a href="about.html">About</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main contact form section -->
    <main>

        <br>
        <!-- Page heading -->
        <h1 style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">Contact Us</h1>
        
        <br><br>
        <!-- Contact instruction text -->
        <h2 style="font-family: italic;">If you have any questions or would like to get in touch with us, please fill out the form 
            below:</h2>

        <br>

        <!-- Customer enquiry form -->
        <form id="contactForm" data-form="contact">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>

            <label for="phone number">Phone Number:</label>
            <input type="text" id="phone number" name="phone number"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location"><br><br>

            <!-- Message field -->
            <label for="message">Message:</label><br>
            <textarea id="message" name="message"></textarea><br><br>

            <!-- SMS reminder opt-in -->
            <input type="checkbox" id="yes" name="service reminder" value="yes">
            <label for="yes">Yes! You can text me service reminders, updates & related messages.</label>

            <br><br>

            <!-- Submit form button -->
            <input type="submit" value="Submit">
            <p id="formFeedback" class="form-feedback" role="status" aria-live="polite"></p>
        </form>
    </main>

    <!-- Footer with copyright information -->
    <footer>
        <p>&copy; 2026 Mlungisi WeKhaya. All rights reserved.</p>
    </footer>
</body>
</html>
